name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes automatizados
        run: npm test
      - name: Gerar relatório JUnit
        run: npm run test:report
      - name: Verificar vulnerabilidades de produção
        run: npm run audit
      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/node-tests.xml
