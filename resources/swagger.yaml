openapi: 3.0.3
info:
  title: API de Espécies de Peixes
  version: 2.0.0
  description: API REST para cadastrar, identificar e consultar informações básicas de espécies de peixes.
servers:
  - url: http://localhost:3000
tags:
  - name: Peixes
paths:
  /api/fish:
    get:
      tags: [Peixes]
      summary: Lista as espécies cadastradas
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Fish' } }
    post:
      tags: [Peixes]
      summary: Cadastra uma espécie com nome popular e nome científico
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFishRequest' }
      responses:
        '201':
          description: Espécie cadastrada
          content: { application/json: { schema: { $ref: '#/components/schemas/FishSuccessResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/fish/identify:
    get:
      tags: [Peixes]
      summary: Identifica uma espécie pelo nome científico
      parameters:
        - name: scientificName
          in: query
          required: true
          schema: { type: string, example: Cichla kelberi }
      responses:
        '200':
          description: Espécie identificada
          content: { application/json: { schema: { $ref: '#/components/schemas/IdentificationSuccessResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Nome científico não identificado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/fish/{id}:
    get:
      tags: [Peixes]
      summary: Consulta as informações básicas de uma espécie
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Informações da espécie
          content: { application/json: { schema: { $ref: '#/components/schemas/FishSuccessResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  responses:
    BadRequest:
      description: Dados inválidos ou ausentes
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Recurso não encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Nome científico já cadastrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnsupportedMediaType:
      description: Content-Type diferente de application/json
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    CreateFishRequest:
      type: object
      required: [commonName, scientificName, regions]
      properties:
        commonName: { type: string, minLength: 1, maxLength: 120, pattern: '\\S', example: Tilápia-do-Nilo }
        scientificName: { type: string, minLength: 3, maxLength: 160, pattern: '^[A-Z][a-z]+\\s[a-z]+(?:\\s[a-z]+)?$', example: Oreochromis niloticus }
        regions:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 120, pattern: '\\S' }
          example: [África, Reservatórios brasileiros]
        description: { type: string, maxLength: 500, pattern: '\\S', example: Peixe de água doce amplamente cultivado. }
    Fish:
      type: object
      required: [id, commonName, scientificName, regions, description]
      properties:
        id: { type: integer, example: 1 }
        commonName: { type: string, example: Peixe-palhaço }
        scientificName: { type: string, example: Amphiprion ocellaris }
        regions: { type: array, items: { type: string }, example: [Oceano Índico, Oceano Pacífico ocidental] }
        description: { type: string, example: Peixe marinho que vive em associação com anêmonas. }
    Identification:
      type: object
      required: [commonName, scientificName, regions]
      properties:
        commonName: { type: string }
        scientificName: { type: string }
        regions: { type: array, items: { type: string } }
    SuccessResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, example: true }, data: {} }
    FishSuccessResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, example: true }, data: { $ref: '#/components/schemas/Fish' } }
    IdentificationSuccessResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, example: true }, data: { $ref: '#/components/schemas/Identification' } }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string, example: SPECIES_NOT_FOUND }, message: { type: string } }
